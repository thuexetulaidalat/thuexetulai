<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chủ Xe - Quản Lý Xe & Lịch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen">
    <nav class="bg-gray-800 text-white p-4 shadow-md flex justify-between items-center mb-6">
        <div class="font-bold text-xl">🚗 Hệ Thống Chủ Xe</div>
        <div class="flex gap-2">
            <a href="chu-xe.html" class="px-4 py-2 bg-green-600 rounded font-bold hover:bg-green-500">Chủ Xe</a>
            <a href="index.html" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-500">Khách Hàng</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 pb-12">
        <h1 class="text-3xl font-bold text-blue-900 mb-6">Trang Quản Lý Dành Cho Chủ Xe</h1>
        
        <!-- KHU VỰC ĐĂNG NHẬP ID -->
        <div class="bg-white p-4 rounded shadow mb-6 flex gap-4" id="login-section">
            <input type="text" id="ownerIdInput" placeholder="Nhập ID (SĐT của bạn)" class="border p-2 rounded w-64 focus:ring-2 focus:ring-blue-400">
            <button onclick="window.loginOwner()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700">Đăng nhập</button>
        </div>

        <div id="owner-workspace" class="hidden">
            <!-- KHU VỰC ĐĂNG XE MỚI -->
            <div class="bg-white p-6 rounded-lg shadow mb-8 border-t-4 border-green-500">
                <h2 class="text-xl font-bold mb-4 text-green-700">Thêm xe mới vào hệ thống</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <input type="text" id="newCarName" placeholder="Tên xe (VD: Mazda 3 2023)" class="border p-2 rounded">
                    <input type="number" id="newCarPrice" placeholder="Giá thuê 1 ngày (VNĐ)" class="border p-2 rounded">
                    <input type="text" id="newCarImage" placeholder="Link ảnh xe (URL)" class="border p-2 rounded">
                </div>
                <button onclick="window.addCar()" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700">Đăng Xe Lên Mạng</button>
            </div>

            <!-- BẢNG ĐƠN HÀNG ĐẶT XE -->
            <h2 class="text-xl font-bold mb-4 text-blue-800">Lịch Khách Đặt Xe Của Bạn</h2>
            <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full bg-white text-sm">
                    <thead class="bg-blue-800 text-white">
                        <tr>
                            <th class="py-3 px-4 text-left">Xe & Khách</th>
                            <th class="py-3 px-4 text-left">Lịch trình & Địa điểm</th>
                            <th class="py-3 px-4 text-left">Tổng Tiền</th>
                            <th class="py-3 px-4 text-left">Trạng Thái</th>
                            <th class="py-3 px-4 text-center">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody id="owner-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // DÁN FIREBASE CONFIG CỦA BẠN VÀO ĐÂY
        const firebaseConfig = {
            apiKey: "AIzaSyBIVpGGE6zKxKkT6R7SUdgB5TLA9Dtfdlk",
            authDomain: "thuexetulai-fcd79.firebaseapp.com",
            projectId: "thuexetulai-fcd79",
            storageBucket: "thuexetulai-fcd79.firebasestorage.app",
            messagingSenderId: "984655156691",
            appId: "1:984655156691:web:ff57df0de4f5f2ee040b26"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let globalBookings = [];
        let myCars = [];
        let currentOwnerId = null;

        // Lắng nghe dữ liệu Lịch đặt xe
        onSnapshot(collection(db, "bookings"), (snapshot) => {
            globalBookings = snapshot.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
            if (currentOwnerId) window.renderOwnerTable();
        });

        // Lắng nghe dữ liệu Danh sách xe
        onSnapshot(collection(db, "cars"), (snapshot) => {
            myCars = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        });

        window.loginOwner = function() {
            const inputId = document.getElementById('ownerIdInput').value.trim();
            if(inputId !== "") {
                currentOwnerId = inputId;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('owner-workspace').classList.remove('hidden');
                window.renderOwnerTable();
                alert(`Đăng nhập thành công với ID: ${currentOwnerId}`);
            } else {
                alert("Vui lòng nhập ID hợp lệ!");
            }
        }

        window.addCar = async function() {
            const name = document.getElementById('newCarName').value.trim();
            const price = parseInt(document.getElementById('newCarPrice').value);
            const image = document.getElementById('newCarImage').value.trim();

            if(!name || !price || !image) {
                alert("Vui lòng điền đủ thông tin xe!"); return;
            }

            try {
                await addDoc(collection(db, "cars"), {
                    ownerId: currentOwnerId,
                    name: name,
                    price: price,
                    image: image
                });
                alert("Đăng xe thành công! Khách hàng đã có thể nhìn thấy xe của bạn.");
                document.getElementById('newCarName').value = '';
                document.getElementById('newCarPrice').value = '';
                document.getElementById('newCarImage').value = '';
            } catch (error) {
                console.error("Lỗi đăng xe:", error);
            }
        }

        window.renderOwnerTable = function() {
            if(!currentOwnerId) return;
            // Chỉ lọc các đơn đặt xe thuộc về những xe do ID này sở hữu
            const myCarIds = myCars.filter(c => c.ownerId === currentOwnerId).map(c => c.id);
            const ownerBookings = globalBookings.filter(b => myCarIds.includes(b.carId));
            
            const tbody = document.getElementById('owner-table-body'); tbody.innerHTML = ''; 
            ownerBookings.forEach(b => {
                const isConfirmed = b.status === 'Đã xác nhận' || b.status === 'Đã thu hồi';
                const phoneDisplay = isConfirmed ? `<span class="text-gray-600">${b.phone}</span>` : `<span class="text-gray-400 italic">*** Chờ cọc ***</span>`;
                let btn = '';
                if (b.status === 'Chờ chủ xe duyệt') btn = `<button onclick="window.ownerApprove('${b.firebaseId}')" class="bg-blue-500 text-white px-3 py-1 rounded w-full font-bold">Duyệt cho thuê</button>`;
                else btn = `<span class="text-gray-500 text-sm">Đã thao tác</span>`;

                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="py-3 px-4"><span class="font-bold text-blue-900">${b.carName}</span><br>${b.customerName}<br>${phoneDisplay}</td>
                        <td class="py-3 px-4">${b.startTime} - ${b.endTime}</td>
                        <td class="py-3 px-4 font-bold text-red-500">${b.totalCost.toLocaleString()}đ</td>
                        <td class="py-3 px-4">${b.status}</td>
                        <td class="py-3 px-4 text-center">${btn}</td>
                    </tr>`;
            });
        }

        window.ownerApprove = async function(firebaseId) {
            await updateDoc(doc(db, "bookings", firebaseId), { status: 'Đợi cọc' });
        }
    </script>
</body>
</html>
