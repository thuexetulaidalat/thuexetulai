<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thuê Xe Tự Lái</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <style>
        .fab-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 1000; }
        .fab-icon img { width: 50px; height: 50px; border-radius: 50%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.3s ease; }
        .fab-icon img:hover { transform: scale(1.1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- HỘP THOẠI ĐẶT XE (MODAL) -->
    <div id="booking-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-md shadow-2xl">
            <h3 class="font-bold text-xl mb-4 text-blue-800">Thông tin đặt xe</h3>
            <p id="modal-car-name" class="text-gray-600 mb-4 font-semibold"></p>
            
            <input type="text" id="customerName" placeholder="Tên khách hàng (*)" class="w-full border p-2 mb-3 rounded focus:ring-2 focus:ring-blue-400">
            <input type="tel" id="customerPhone" placeholder="Số điện thoại (*)" class="w-full border p-2 mb-3 rounded focus:ring-2 focus:ring-blue-400">
            <input type="text" id="deliveryAddress" placeholder="Địa chỉ giao xe (Có thể báo sau)" class="w-full border p-2 mb-3 rounded focus:ring-2 focus:ring-blue-400">
            <input type="text" id="returnAddress" placeholder="Địa chỉ trả xe (Có thể báo sau)" class="w-full border p-2 mb-4 rounded focus:ring-2 focus:ring-blue-400">
            
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="bg-gray-400 text-white px-4 py-2 rounded font-bold">Hủy</button>
                <button onclick="submitBooking()" class="bg-green-600 text-white px-4 py-2 rounded font-bold">Xác nhận Đặt</button>
            </div>
        </div>
    </div>

    <!-- TIÊU ĐỀ KHÁCH HÀNG -->
    <header class="bg-blue-600 text-white text-center p-6 shadow-md">
        <h1 class="text-3xl font-bold">Thuê Xe Tự Lái - Nhanh Chóng & Chuyên Nghiệp</h1>
        <p class="mt-2 text-blue-100">Chọn thời gian để kiểm tra xe trống và nhận báo giá</p>
    </header>

    <!-- BỘ LỌC THỜI GIAN -->
    <div class="max-w-4xl mx-auto mt-6 bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 font-bold mb-1">Thời gian nhận xe</label>
                <input type="text" id="startTime" class="w-full border rounded p-2 bg-white" placeholder="Chọn ngày giờ...">
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-1">Thời gian trả xe</label>
                <input type="text" id="endTime" class="w-full border rounded p-2 bg-white" placeholder="Chọn ngày giờ...">
            </div>
        </div>
        <button onclick="searchAvailableCars()" class="mt-4 w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">
            KIỂM TRA XE
        </button>
        <p id="search-msg" class="text-red-500 text-sm mt-2 hidden text-center font-bold">Vui lòng chọn thời gian hợp lệ!</p>
    </div>

    <!-- DANH SÁCH XE -->
    <div class="max-w-6xl mx-auto mt-8 px-4 pb-20">
        <h2 id="list-title" class="text-2xl font-bold text-gray-800 mb-6">Danh sách xe của chúng tôi</h2>
        <div id="car-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- NÚT LIÊN HỆ -->
    <div class="fab-container">
        <a href="https://zalo.me/0779779606" target="_blank" class="fab-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Icon_of_Zalo.svg/1024px-Icon_of_Zalo.svg.png" alt="Zalo"></a>
        <a href="https://m.me/29024354103822524" target="_blank" class="fab-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Facebook_Messenger_logo_2020.svg/1024px-Facebook_Messenger_logo_2020.svg.png" alt="Messenger"></a>
    </div>

    <script>
        let isTimeSelected = false;
        let pendingCarSelection = null;

        const flatpickrConfig = { enableTime: true, dateFormat: "Y/m/d H:i", time_24hr: true, minuteIncrement: 30, locale: "vn" };
        flatpickr("#startTime", flatpickrConfig);
        flatpickr("#endTime", flatpickrConfig);

        const cars = [
            { id: 1, name: "VinFast VF 5 Plus", price: 700000, image: "https://images.unsplash.com/photo-1560958089-b8a1929cea89?w=800&q=80", ownerChatId: "ĐIỀN_CHAT_ID_CHỦ_XE_1" },
            { id: 2, name: "Toyota Vios 2022", price: 600000, image: "https://images.unsplash.com/photo-1590362891991-f776e747a588?w=800&q=80", ownerChatId: "ĐIỀN_CHAT_ID_CHỦ_XE_2" },
            { id: 3, name: "Mazda 3 2023", price: 800000, image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800&q=80", ownerChatId: "ĐIỀN_CHAT_ID_CHỦ_XE_3" }
        ];

        if (!localStorage.getItem('bookings')) localStorage.setItem('bookings', JSON.stringify([]));

        function calculateRentalDays(startStr, endStr) {
            const start = new Date(startStr); const end = new Date(endStr);
            let totalDays = 0;
            let currentDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
            let endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());

            while (currentDay <= endDay) {
                let b1Start = new Date(currentDay); b1Start.setHours(6, 0, 0, 0);
                let b1End = new Date(currentDay); b1End.setHours(15, 0, 0, 0);
                let b2Start = new Date(currentDay); b2Start.setHours(15, 0, 0, 0);
                let b2End = new Date(currentDay); b2End.setHours(21, 30, 0, 0);
                if (start < b1End && end > b1Start) totalDays += 0.5;
                if (start < b2End && end > b2Start) totalDays += 0.5;
                currentDay.setDate(currentDay.getDate() + 1);
            }
            return totalDays;
        }

        function isCarAvailable(carId, checkStart, checkEnd) {
            const bookings = JSON.parse(localStorage.getItem('bookings'));
            const start = new Date(checkStart).getTime(); const end = new Date(checkEnd).getTime();
            for (let b of bookings) {
                if (b.carId === carId && (b.status === 'Đã xác nhận' || b.status === 'Đợi cọc')) {
                    const bookedStart = new Date(b.startTime).getTime();
                    const bookedEnd = new Date(b.endTime).getTime();
                    if (start < bookedEnd && end > bookedStart) return false;
                }
            }
            return true;
        }

        async function sendTelegramNotification(chatId, carName, total) {
            if(chatId.includes("ĐIỀN")) return;
            const BOT_TOKEN = "ĐIỀN_TOKEN_BOT_CỦA_BẠN";
            const msg = `🚨 CÓ ĐƠN ĐẶT XE ${carName} MỚI!\n💰 Tổng tiền: ${total.toLocaleString()} đ\nVào web xác nhận ngay!`;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: msg })
            });
        }

        function renderCars(carArray, showStatus = false) {
            const list = document.getElementById('car-list'); list.innerHTML = '';
            const startStr = document.getElementById('startTime').value;
            const endStr = document.getElementById('endTime').value;

            carArray.forEach(car => {
                let isAvailable = true;
                let priceHTML = `<p class="text-gray-500 font-medium mt-2">Giá: ${car.price.toLocaleString()} đ / Ngày</p>`;
                let buttonHTML = `<button onclick="openModal(${car.id})" class="mt-4 w-full bg-green-500 text-white font-bold py-2 rounded">CHỌN THUÊ XE NÀY</button>`;
                let cardStyle = "";

                if (showStatus && isTimeSelected) {
                    isAvailable = isCarAvailable(car.id, startStr, endStr);
                    if (isAvailable) {
                        const rentalDays = calculateRentalDays(startStr, endStr);
                        const totalCost = rentalDays * car.price;
                        priceHTML = `<div class="mt-2 p-3 bg-blue-50 rounded border border-blue-100"><p class="text-blue-800 font-bold text-lg">Tổng: ${totalCost.toLocaleString()} đ</p><p class="text-sm text-blue-600">(Cho ${rentalDays} ngày thuê)</p></div>`;
                    } else {
                        cardStyle = "opacity-75 grayscale";
                        priceHTML = `<div class="mt-2 p-3 bg-red-50 rounded border border-red-200"><p class="text-red-600 font-bold text-lg">Trùng lịch</p><p class="text-sm text-red-500">Đã có khách đặt trong khoảng thời gian này</p></div>`;
                        buttonHTML = `<button disabled class="mt-4 w-full bg-gray-400 text-white font-bold py-2 rounded cursor-not-allowed">ĐÃ ĐƯỢC ĐẶT</button>`;
                    }
                }
                list.innerHTML += `<div class="bg-white rounded-lg shadow-lg overflow-hidden flex flex-col ${cardStyle}"><img src="${car.image}" class="h-48 w-full object-cover"><div class="p-5 flex-grow flex flex-col justify-between"><div><h3 class="text-xl font-bold">${car.name}</h3>${priceHTML}</div>${buttonHTML}</div></div>`;
            });
        }

        function searchAvailableCars() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            const msg = document.getElementById('search-msg');
            const startDate = new Date(start); const endDate = new Date(end);

            if (!start || !end || startDate >= endDate) { msg.classList.remove('hidden'); return; }
            msg.classList.add('hidden'); isTimeSelected = true;
            document.getElementById('list-title').innerText = "Trạng thái các xe trong thời gian bạn chọn";
            renderCars(cars, true);
        }

        function openModal(carId) {
            if (!isTimeSelected) {
                alert("Vui lòng chọn Thời gian nhận và trả xe trước!");
                window.scrollTo({ top: 0, behavior: 'smooth' }); return;
            }
            pendingCarSelection = cars.find(c => c.id === carId);
            document.getElementById('modal-car-name').innerText = `Xe đã chọn: ${pendingCarSelection.name}`;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('booking-modal').classList.add('hidden');
            pendingCarSelection = null;
        }

        function submitBooking() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const delivery = document.getElementById('deliveryAddress').value.trim();
            const returnAdd = document.getElementById('returnAddress').value.trim();

            if(!name || !phone) {
                alert("Vui lòng điền tối thiểu Tên và Số điện thoại!"); return;
            }

            const startStr = document.getElementById('startTime').value;
            const endStr = document.getElementById('endTime').value;
            const totalCost = calculateRentalDays(startStr, endStr) * pendingCarSelection.price;

            const newBooking = {
                id: Date.now().toString(), carId: pendingCarSelection.id, carName: pendingCarSelection.name,
                customerName: name, phone: phone, deliveryAddress: delivery, returnAddress: returnAdd,
                startTime: startStr, endTime: endStr, totalCost: totalCost, status: 'Chờ chủ xe duyệt'
            };

            const bookings = JSON.parse(localStorage.getItem('bookings'));
            bookings.push(newBooking);
            localStorage.setItem('bookings', JSON.stringify(bookings));

            sendTelegramNotification(pendingCarSelection.ownerChatId, pendingCarSelection.name, totalCost);

            document.getElementById('customerName').value = ''; document.getElementById('customerPhone').value = '';
            document.getElementById('deliveryAddress').value = ''; document.getElementById('returnAddress').value = '';

            closeModal();
            alert("Thành công! Chờ chủ xe duyệt và quản lý liên hệ thu cọc.");
            searchAvailableCars();
        }

        window.onload = () => { renderCars(cars, false); };
    </script>
</body>
</html>
